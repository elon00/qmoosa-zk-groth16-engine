name: Groth16 Zero-Knowledge Engine CI Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout engine repository
        uses: actions/checkout@v4
        with:
          path: qmoosa-zk-groth16-engine

      - name: Checkout protocol repository (Pinned Commit)
        uses: actions/checkout@v4
        with:
          repository: elon00/qmoosa-zk-groth16-protocol
          ref: 9b7f29227196b57f2c3d9f52cb123f72c5fd6afc
          path: qmoosa-zk-groth16-protocol

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build protocol repository
        run: |
          cd qmoosa-zk-groth16-protocol
          npm install
          npm run build
          npm pack

      - name: Install dependencies in engine repository
        working-directory: qmoosa-zk-groth16-engine
        run: |
          npm install

      - name: Compile TypeScript
        working-directory: qmoosa-zk-groth16-engine
        run: npm run build

      - name: Run Engine Verification Tests
        working-directory: qmoosa-zk-groth16-engine
        run: npm test

      - name: Syntax & Type Check
        working-directory: qmoosa-zk-groth16-engine
        run: npm run lint
